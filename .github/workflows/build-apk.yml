name: Build Aetherfall APK
on:
  push:
    branches: [main]
    paths-ignore: ['godot/**', 'tools/**', 'docs/**', '.github/workflows/godot-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Make sure Android SDK 34 is installed
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || echo "::warning::sdkmanager install step had a problem"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "What went wrong|error:|Error:|FAILURE|Could not|> " build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Save APK to the apk branch and publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Aetherfall.apk
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Aetherfall.apk --title "Aetherfall (build ${GITHUB_RUN_NUMBER})" --notes "Tap Aetherfall.apk below to download, then open it to install." --latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rfq --cached .
          git add -f Aetherfall.apk
          git commit -qm "APK from build ${GITHUB_RUN_NUMBER}"
          git push -f origin apk
