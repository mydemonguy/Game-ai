name: Build Aetherfall (Godot) APK
on:
  push:
    branches: [main]
    paths: ['godot/**', '.github/workflows/godot-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
env:
  GODOT_VERSION: 4.6.3
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null || echo "::warning::sdkmanager had a problem"
      - name: Download Godot and its export templates
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q tpl.tpz 'templates/android_*' 'templates/web_nothreads_release.zip' 'templates/version.txt'
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm tpl.tpz
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-4.6.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/$f"
          done
      - name: Import and export
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/app/aetherfall-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cd godot
          "$RUNNER_TEMP/godot" --headless --import 2>&1 | grep -E "ERROR|SCRIPT" | head -40 || true
          mkdir -p export
          "$RUNNER_TEMP/godot" --headless --export-debug "Android" export/Aetherfall-Godot.apk 2>&1 | tee export.log
          ls -la export
          test -s export/Aetherfall-Godot.apk
          mkdir -p export/web
          "$RUNNER_TEMP/godot" --headless --export-release "Web" export/web/index.html 2>&1 | tail -5
          test -s export/web/index.wasm
      - name: Project zip for the Godot app on a phone
        run: |
          cd godot
          zip -qr ../Aetherfall-Godot-project.zip . -x '.godot/*' 'export/*' 'export.log' '*.import'
          (cd export/web && zip -qr ../../../Aetherfall-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: Aetherfall-Godot
          path: |
            godot/export/Aetherfall-Godot.apk
            Aetherfall-Godot-project.zip
      - name: Publish a release and the apk-godot branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp godot/export/Aetherfall-Godot.apk Aetherfall-Godot.apk
          TAG="godot-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Aetherfall-Godot.apk Aetherfall-Godot-project.zip Aetherfall-web.zip --title "Aetherfall · Godot edition (build ${GITHUB_RUN_NUMBER})" --notes "Aetherfall rebuilt in Godot 4.6. Aetherfall-Godot.apk installs next to the original game. Aetherfall-Godot-project.zip opens in the Godot 4 editor (Project Manager → Import)." --latest=false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-godot
          git rm -rfq --cached .
          git add -f Aetherfall-Godot.apk
          git commit -qm "Godot APK from build ${GITHUB_RUN_NUMBER}"
          git push -f origin apk-godot
          # the public web page: landing page at the root, the browser build under /play/
          rm -rf /tmp/site && mkdir -p /tmp/site/play
          cp -r "$GITHUB_WORKSPACE/godot/web/." /tmp/site/ 2>/dev/null || true
          rm -f /tmp/site/.gdignore
          cp -r "$GITHUB_WORKSPACE/godot/export/web/." /tmp/site/play/
          touch /tmp/site/.nojekyll
          git checkout -q --orphan gh-pages
          git rm -rfq --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/site/. .
          git add -A
          git commit -qm "Web build ${GITHUB_RUN_NUMBER}"
          git push -f origin gh-pages
          # turn GitHub Pages on for the gh-pages branch (only works if the token is allowed to; otherwise enable it once in Settings → Pages)
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f "source[branch]=gh-pages" -f "source[path]=/" > /dev/null 2>&1 && echo "Pages enabled" || gh api "repos/$GITHUB_REPOSITORY/pages" -q '"Pages: " + .html_url + " " + .status' || echo "::warning::GitHub Pages is not enabled yet: Settings → Pages → Deploy from branch gh-pages"
