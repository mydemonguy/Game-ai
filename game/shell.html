<title>Aetherfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one 1080-tall Phaser stage (width follows the screen) scaled to fit, HTML overlays for story and menus, thumb controls pinned to the lower corners */
:root{
  --void:#07060f; --panel:rgba(12,10,26,.86); --ink:#ece7ff; --dim:#9d97bd;
  --aether:#5ce1ff; --ember:#ff8a4c; --rune:#b48cff; --blood:#ff3d6e;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--void)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42))}
#stage canvas{display:block;background:#000}
button{font-family:var(--ui);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--aether);outline-offset:3px}

/* overlay screens */
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;z-index:5;
  background:radial-gradient(ellipse at 50% 40%,rgba(30,20,70,.55),rgba(5,4,12,.9) 70%)}
.card .row{position:sticky;bottom:calc(-1 * clamp(18px,3vw,36px));margin-bottom:calc(-1 * clamp(18px,3vw,36px));padding-block:14px clamp(18px,3vw,36px);background:rgba(12,10,26,.98);box-shadow:0 -14px 14px rgba(12,10,26,.9)}
.card{max-width:min(760px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:clamp(18px,3vw,36px);box-sizing:border-box;
  background:var(--panel);border:1px solid rgba(180,140,255,.35);box-shadow:0 0 60px rgba(92,225,255,.12),inset 0 0 40px rgba(180,140,255,.06)}
.eyebrow{margin:0;font-size:clamp(11px,1.4vw,14px);letter-spacing:.32em;text-transform:uppercase;color:var(--aether)}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(46px,9vw,120px);line-height:.95;letter-spacing:.06em;text-wrap:balance;
  background:linear-gradient(180deg,#fff 10%,var(--aether) 55%,var(--rune));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(92,225,255,.35))}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,44px);line-height:1.1;letter-spacing:.04em;text-wrap:balance}
.body{font-size:clamp(14px,1.9vw,18px);line-height:1.6;color:#d6d0f2;max-width:62ch}
.body p{margin:0 0 .8em}
.body .who{color:var(--rune);font-weight:700;letter-spacing:.08em}
.tag{margin:0;font-family:var(--display);font-size:clamp(14px,2vw,20px);color:var(--dim);font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{font-size:clamp(14px,1.8vw,18px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:12px 22px;
  background:linear-gradient(180deg,rgba(92,225,255,.18),rgba(92,225,255,.05));border:1px solid var(--aether);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.btn.alt{border-color:var(--rune);background:rgba(180,140,255,.08)}
.btn:active{transform:translateY(1px);background:rgba(92,225,255,.3)}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lvgrid button{text-align:left;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(180,140,255,.3);font-size:14px;line-height:1.3}
.lvgrid button b{display:block;font-family:var(--display);font-size:16px;color:var(--ink)}
.lvgrid button span{color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.lvgrid button:disabled{opacity:.35;cursor:not-allowed}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.keys kbd{font-family:var(--ui);font-weight:700;color:var(--aether)}
.vols{display:grid;gap:14px;min-width:min(420px,70vw)}
.vol{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:14px;font-family:var(--ui);font-weight:700;color:var(--aether)}
.vol input{width:100%;accent-color:#b48cff;height:28px}
#mapc{display:block;margin:0 auto}

/* touch controls: floating thumbstick on the left, arc of actions on the right; sized from screen height */
#pad{position:fixed;inset:0;z-index:3;pointer-events:none;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
#stickZone{position:absolute;left:0;top:24%;bottom:0;width:46%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;left:calc(var(--sl) + min(20vh,96px));bottom:min(6vh,28px);width:min(30vh,136px);height:min(30vh,136px);transform:translate(-50%,0);border-radius:50%;
  background:radial-gradient(closest-side,rgba(92,225,255,.12),rgba(92,225,255,.02) 70%,transparent 71%),rgba(12,10,30,.38);
  border:2px solid rgba(236,231,255,.26);box-shadow:inset 0 0 26px rgba(92,225,255,.16);opacity:.38;transition:opacity .15s}
#stickBase.live{opacity:1;transition:none}
#stickBase i{position:absolute;top:50%;width:0;height:0;margin-top:-7px;border:7px solid transparent;opacity:.55}
#stickBase i.lf{left:9%;border-right:10px solid #ece7ff;border-left:0}
#stickBase i.rt{right:9%;border-left:10px solid #ece7ff;border-right:0}
#stickKnob{position:absolute;left:50%;top:50%;width:44%;height:44%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0,#c8f3ff 16%,#5ce1ff 46%,#244e8c 100%);box-shadow:0 0 18px rgba(92,225,255,.55),0 3px 8px rgba(0,0,0,.4)}
.act{pointer-events:auto;position:absolute;border-radius:50%;display:grid;place-items:center;touch-action:none;padding:0;
  border:2px solid rgba(236,231,255,.3);background:radial-gradient(circle at 50% 30%,rgba(70,58,128,.62),rgba(12,10,30,.6) 70%);
  color:#ece7ff;box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 0 18px rgba(180,140,255,.14);opacity:.62;transition:transform .07s,box-shadow .07s,opacity .1s}
.act svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.act.on{opacity:1;transform:scale(.88);border-color:#fff;box-shadow:0 0 24px var(--glow,rgba(92,225,255,.7))}
.act::before{content:"";position:absolute;inset:-7px;border-radius:50%;pointer-events:none;display:none;
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(closest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.atk{width:min(21vh,100px);height:min(21vh,100px);right:calc(var(--sr) + min(4vh,20px));bottom:min(4vh,18px);border-color:rgba(255,138,76,.8);--glow:rgba(255,138,76,.85);color:#ffe0cc;
  background:radial-gradient(circle at 50% 30%,rgba(140,60,40,.6),rgba(30,10,14,.6) 72%)}
.jmp{width:min(16vh,76px);height:min(16vh,76px);right:calc(var(--sr) + min(27.5vh,130px));bottom:min(2.5vh,12px)}
.dsh{width:min(13.5vh,64px);height:min(13.5vh,64px);right:calc(var(--sr) + min(25vh,118px));bottom:min(21vh,100px);--glow:rgba(180,140,255,.85);color:#ddd0ff}
.sp{width:min(14.5vh,68px);height:min(14.5vh,68px);right:calc(var(--sr) + min(6vh,28px));bottom:min(28.5vh,136px);color:#c8f6ff;--glow:rgba(92,225,255,.85)}
.sp::before,.dsh::before{display:block}
.sp::before{background:conic-gradient(#5ce1ff calc(var(--e,0)*1turn),rgba(236,231,255,.13) 0)}
.dsh::before{background:conic-gradient(#b48cff calc(var(--c,1)*1turn),rgba(236,231,255,.13) 0)}
.sp.ready{opacity:.95;border-color:#5ce1ff;box-shadow:0 0 22px rgba(92,225,255,.7),inset 0 0 14px rgba(92,225,255,.25)}
.sp.ready svg{fill:currentColor}
.ps{pointer-events:auto;position:absolute;right:calc(var(--sr) + 14px);top:calc(var(--st) + 12px);width:46px;height:46px;border-radius:14px;
  border:2px solid rgba(236,231,255,.3);background:rgba(12,10,30,.5);color:#ece7ff;font-weight:700;font-size:16px;display:grid;place-items:center}
#rotate{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--void);font-family:var(--display);font-size:22px}
#rotate small{font-family:var(--ui);color:var(--dim);font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:470px){.card{gap:8px;padding:14px 22px} h1{font-size:clamp(40px,8vw,64px)} h2{font-size:clamp(22px,3.4vw,32px)} .body{font-size:14px;line-height:1.5} .lvgrid{grid-template-columns:repeat(3,1fr);gap:6px} .lvgrid button{padding:6px 10px} .lvgrid button b{font-size:14px} .keys{font-size:13px;gap:4px 12px} .btn{padding:9px 18px}}
</style>

<div id="stage" aria-label="Aetherfall game screen"></div>

<div id="pad" hidden>
  <div id="stickZone" aria-label="Move: drag left or right"><div id="stickBase"><i class="lf"></i><i class="rt"></i><div id="stickKnob"></div></div></div>
  <button class="act sp" data-k="special" aria-label="Starburst"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.3 6.6H21l-5.4 4.1 2.1 6.6L12 15.8l-5.7 4 2.1-6.6L3 9.1h6.7Z"/></svg></button>
  <button class="act dsh" data-k="dash" aria-label="Dash"><svg viewBox="0 0 24 24"><path d="M5 6l6 6-6 6"/><path d="M12 6l6 6-6 6"/></svg></button>
  <button class="act atk" data-k="attack" aria-label="Attack"><svg viewBox="0 0 24 24"><path d="M19.5 3h1.5v1.5L10 15.5 8.5 14Z"/><path d="M5.5 12.5l6 6"/><path d="M7.8 16.2L4 20"/></svg></button>
  <button class="act jmp" data-k="jump" aria-label="Jump"><svg viewBox="0 0 24 24"><path d="M6 13l6-6 6 6"/><path d="M6 18.5l6-6 6 6" opacity=".55"/></svg></button>
  <button class="ps" id="pauseBtn" aria-label="Pause">II</button>
</div>

<div id="scr" class="scr"><div class="card" id="card"></div></div>
<div id="rotate" hidden>Turn your phone sideways<small>Aetherfall plays in landscape</small></div>
