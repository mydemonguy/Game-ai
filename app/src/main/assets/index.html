/* Layout: one 1920x1080 stage scaled to fit, HTML overlays for story and menus, thumb controls pinned to the lower corners */
:root{
  --void:#07060f; --panel:rgba(12,10,26,.86); --ink:#ece7ff; --dim:#9d97bd;
  --aether:#5ce1ff; --ember:#ff8a4c; --rune:#b48cff; --blood:#ff3d6e;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--void)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42))}
#c{display:block;background:#000;image-rendering:auto}
button{font-family:var(--ui);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--aether);outline-offset:3px}

/* overlay screens */
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;z-index:5;
  background:radial-gradient(ellipse at 50% 40%,rgba(30,20,70,.55),rgba(5,4,12,.9) 70%)}
.card .row{position:sticky;bottom:calc(-1 * clamp(18px,3vw,36px));margin-bottom:calc(-1 * clamp(18px,3vw,36px));padding-block:16px clamp(18px,3vw,36px);background:linear-gradient(rgba(12,10,26,0),rgba(12,10,26,.98) 14px)}
.card{max-width:min(760px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:clamp(18px,3vw,36px);box-sizing:border-box;
  background:var(--panel);border:1px solid rgba(180,140,255,.35);box-shadow:0 0 60px rgba(92,225,255,.12),inset 0 0 40px rgba(180,140,255,.06)}
.eyebrow{margin:0;font-size:clamp(11px,1.4vw,14px);letter-spacing:.32em;text-transform:uppercase;color:var(--aether)}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(46px,9vw,120px);line-height:.95;letter-spacing:.06em;text-wrap:balance;
  background:linear-gradient(180deg,#fff 10%,var(--aether) 55%,var(--rune));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(92,225,255,.35))}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,44px);line-height:1.1;letter-spacing:.04em;text-wrap:balance}
.body{font-size:clamp(14px,1.9vw,18px);line-height:1.6;color:#d6d0f2;max-width:62ch}
.body p{margin:0 0 .8em}
.body .who{color:var(--rune);font-weight:700;letter-spacing:.08em}
.tag{margin:0;font-family:var(--display);font-size:clamp(14px,2vw,20px);color:var(--dim);font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{font-size:clamp(14px,1.8vw,18px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:12px 22px;
  background:linear-gradient(180deg,rgba(92,225,255,.18),rgba(92,225,255,.05));border:1px solid var(--aether);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.btn.alt{border-color:var(--rune);background:rgba(180,140,255,.08)}
.btn:active{transform:translateY(1px);background:rgba(92,225,255,.3)}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lvgrid button{text-align:left;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(180,140,255,.3);font-size:14px;line-height:1.3}
.lvgrid button b{display:block;font-family:var(--display);font-size:16px;color:var(--ink)}
.lvgrid button span{color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.lvgrid button:disabled{opacity:.35;cursor:not-allowed}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.keys kbd{font-family:var(--ui);font-weight:700;color:var(--aether)}
.vols{display:grid;gap:14px;min-width:min(420px,70vw)}
.vol{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:14px;font-family:var(--ui);font-weight:700;color:var(--aether)}
.vol input{width:100%;accent-color:#b48cff;height:28px}
#mapc{display:block;margin:0 auto}

/* touch controls: floating thumbstick on the left, arc of actions on the right; sized from screen height */
#pad{position:fixed;inset:0;z-index:3;pointer-events:none;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
#stickZone{position:absolute;left:0;top:24%;bottom:0;width:46%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;left:calc(var(--sl) + min(20vh,96px));bottom:min(6vh,28px);width:min(30vh,136px);height:min(30vh,136px);transform:translate(-50%,0);border-radius:50%;
  background:radial-gradient(closest-side,rgba(92,225,255,.12),rgba(92,225,255,.02) 70%,transparent 71%),rgba(12,10,30,.38);
  border:2px solid rgba(236,231,255,.26);box-shadow:inset 0 0 26px rgba(92,225,255,.16);opacity:.38;transition:opacity .15s}
#stickBase.live{opacity:1;transition:none}
#stickBase i{position:absolute;top:50%;width:0;height:0;margin-top:-7px;border:7px solid transparent;opacity:.55}
#stickBase i.lf{left:9%;border-right:10px solid #ece7ff;border-left:0}
#stickBase i.rt{right:9%;border-left:10px solid #ece7ff;border-right:0}
#stickKnob{position:absolute;left:50%;top:50%;width:44%;height:44%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0,#c8f3ff 16%,#5ce1ff 46%,#244e8c 100%);box-shadow:0 0 18px rgba(92,225,255,.55),0 3px 8px rgba(0,0,0,.4)}
.act{pointer-events:auto;position:absolute;border-radius:50%;display:grid;place-items:center;touch-action:none;padding:0;
  border:2px solid rgba(236,231,255,.3);background:radial-gradient(circle at 50% 30%,rgba(70,58,128,.62),rgba(12,10,30,.6) 70%);
  color:#ece7ff;box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 0 18px rgba(180,140,255,.14);opacity:.62;transition:transform .07s,box-shadow .07s,opacity .1s}
.act svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.act.on{opacity:1;transform:scale(.88);border-color:#fff;box-shadow:0 0 24px var(--glow,rgba(92,225,255,.7))}
.act::before{content:"";position:absolute;inset:-7px;border-radius:50%;pointer-events:none;display:none;
  -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(closest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.atk{width:min(21vh,100px);height:min(21vh,100px);right:calc(var(--sr) + min(4vh,20px));bottom:min(4vh,18px);border-color:rgba(255,138,76,.8);--glow:rgba(255,138,76,.85);color:#ffe0cc;
  background:radial-gradient(circle at 50% 30%,rgba(140,60,40,.6),rgba(30,10,14,.6) 72%)}
.jmp{width:min(16vh,76px);height:min(16vh,76px);right:calc(var(--sr) + min(27.5vh,130px));bottom:min(2.5vh,12px)}
.dsh{width:min(13.5vh,64px);height:min(13.5vh,64px);right:calc(var(--sr) + min(25vh,118px));bottom:min(21vh,100px);--glow:rgba(180,140,255,.85);color:#ddd0ff}
.sp{width:min(14.5vh,68px);height:min(14.5vh,68px);right:calc(var(--sr) + min(6vh,28px));bottom:min(28.5vh,136px);color:#c8f6ff;--glow:rgba(92,225,255,.85)}
.sp::before,.dsh::before{display:block}
.sp::before{background:conic-gradient(#5ce1ff calc(var(--e,0)*1turn),rgba(236,231,255,.13) 0)}
.dsh::before{background:conic-gradient(#b48cff calc(var(--c,1)*1turn),rgba(236,231,255,.13) 0)}
.sp.ready{opacity:.9;border-color:#5ce1ff;animation:ready 1.1s ease-in-out infinite}
.sp.ready svg{fill:currentColor}
@keyframes ready{50%{box-shadow:0 0 28px rgba(92,225,255,.8),inset 0 0 18px rgba(92,225,255,.3)}}
.ps{pointer-events:auto;position:absolute;right:calc(var(--sr) + 14px);top:calc(var(--st) + 12px);width:46px;height:46px;border-radius:14px;
  border:2px solid rgba(236,231,255,.3);background:rgba(12,10,30,.5);color:#ece7ff;font-weight:700;font-size:16px;display:grid;place-items:center}
#rotate{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--void);font-family:var(--display);font-size:22px}
#rotate small{font-family:var(--ui);color:var(--dim);font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:470px){.card{gap:8px;padding:14px 22px} h1{font-size:clamp(40px,8vw,64px)} h2{font-size:clamp(22px,3.4vw,32px)} .body{font-size:14px;line-height:1.5} .lvgrid{grid-template-columns:repeat(3,1fr);gap:6px} .lvgrid button{padding:6px 10px} .lvgrid button b{font-size:14px} .keys{font-size:13px;gap:4px 12px} .btn{padding:9px 18px}}
</style>
</head><body>


<div id="stage"><canvas id="c" width="2400" height="1080" aria-label="Aetherfall game screen"></canvas></div>
<div id="vig"></div>

<div id="pad" hidden>
  <div id="stickZone" aria-label="Move: drag left or right"><div id="stickBase"><i class="lf"></i><i class="rt"></i><div id="stickKnob"></div></div></div>
  <button class="act sp" data-k="special" aria-label="Starburst"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.3 6.6H21l-5.4 4.1 2.1 6.6L12 15.8l-5.7 4 2.1-6.6L3 9.1h6.7Z"/></svg></button>
  <button class="act dsh" data-k="dash" aria-label="Dash"><svg viewBox="0 0 24 24"><path d="M5 6l6 6-6 6"/><path d="M12 6l6 6-6 6"/></svg></button>

<script>
"use strict";
const C=document.getElementById('c');let X=C.getContext('2d',{alpha:false});
let W=1920;const H=1080,GY=880;
const touchy=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
/* stage pixels on the right that the touch buttons cover; enemies are kept out of that strip */
const RSAFE=touchy?500:200;
/* the stage is always 1080 tall; its width follows the screen (1920 on 16:9, 2400 on a 20:9 phone), so there are no black bars */
function fit(){const w=innerWidth,h=innerHeight,land=w>=h;
  const nw=land?Math.round(Math.min(2560,Math.max(1440,H*w/h))):1920;
  if(nw!==W||C.width!==nw){W=nw;C.width=W;C.height=H;C._dirty=1}
  const s=Math.min(w/W,h/H);C.style.width=W*s+'px';C.style.height=H*s+'px';
  document.getElementById('rotate').hidden=!(touchy&&h>w*1.05);}
addEventListener('resize',fit);fit();

/* ---------- input ---------- */
const K={left:0,right:0,jump:0,attack:0,special:0,dash:0,down:0},P={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyJ:'attack',KeyX:'attack',KeyK:'special',KeyC:'special',KeyL:'dash',ShiftLeft:'dash',ShiftRight:'dash',ArrowDown:'down',KeyS:'down'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k&&G.state==='play'){if(!K[k])P[k]=1;K[k]=1;e.preventDefault()}
  if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat)togglePause();});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)K[k]=0});
/* action buttons: no pointer capture, so a thumb can slide from one button onto another */
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,ids=new Set();
  const press=e=>{if(!ids.size){if(!K[k])P[k]=1;K[k]=1;b.classList.add('on');buzz(6)}ids.add(e.pointerId)};
  const rel=e=>{ids.delete(e.pointerId);if(!ids.size){K[k]=0;b.classList.remove('on')}};
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();try{b.releasePointerCapture(e.pointerId)}catch(_){}press(e)});
  b.addEventListener('pointerenter',e=>{if(e.pointerType==='touch'||e.buttons)press(e)});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,rel));
  b._clear=()=>{ids.clear();K[k]=0;b.classList.remove('on')}});
/* floating thumbstick: touch anywhere in the left zone, the stick centres under the thumb */
const SZ=document.getElementById('stickZone'),SB=document.getElementById('stickBase'),SK=document.getElementById('stickKnob');
const stick={id:null,ox:0,oy:0,x:0};
function stickSet(dx,dy){dy=dy||0;const r=SB.offsetWidth*.42||60,n=Math.max(-1,Math.min(1,dx/r)),m=Math.max(-1,Math.min(1,dy/r));stick.x=n;
  SK.style.transform=`translate(calc(-50% + ${n*r}px),calc(-50% + ${m*r*.7}px))`;K.left=n<-.28?1:0;K.right=n>.28?1:0;const dn=m>.55?1:0;if(dn&&!K.down)P.down=1;K.down=dn}
function stickEnd(){stick.id=null;stick.x=0;K.left=K.right=K.down=0;SB.classList.remove('live');SB.style.left='';SB.style.bottom='';SB.style.top='';SK.style.transform=''}
SZ.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(stick.id!==null)return;stick.id=e.pointerId;try{SZ.setPointerCapture(e.pointerId)}catch(_){}
  const zr=SZ.getBoundingClientRect(),half=SB.offsetWidth/2;
  const x=Math.max(zr.left+half,Math.min(zr.right-half,e.clientX)),y=Math.max(zr.top+half,Math.min(zr.bottom-half,e.clientY));
  stick.ox=x;stick.oy=y;SB.style.left=(x-zr.left)+'px';SB.style.top=(y-zr.top-half)+'px';SB.style.bottom='auto';SB.classList.add('live');stickSet(e.clientX-x,e.clientY-y)});
SZ.addEventListener('pointermove',e=>{if(e.pointerId!==stick.id)return;e.preventDefault();stickSet(e.clientX-stick.ox,e.clientY-stick.oy)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>SZ.addEventListener(t,e=>{if(e.pointerId===stick.id)stickEnd()}));
function buzz(p){try{if(touchy&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function clearInput(){if(typeof stickEnd==='function'&&stick.id!==null)stickEnd();for(const k in K)K[k]=0;for(const k in P)delete P[k];document.querySelectorAll('[data-k]').forEach(b=>{b.classList.remove('on');if(b._clear)b._clear()})}

/* ---------- world data ---------- */

const STORY={
 intro:[
  {ey:'The Age of Aether',h:'The Starblood Clan',b:`<p>For a thousand years the kingdom of <b>Ithra</b> ran on the Aether, the living light that flows between the stars.</p><p>Its keepers were the <b>Starblood</b>, a clan of dinosaurs whose claws could hold starlight. They guarded the great reactors, and the reactors kept every city in Ithra bright.</p>`},
  {ey:'The Fall',h:'Malakar Opens the Rift',b:`<p>Then <b>Malakar</b>, the clan's own Egg-Keeper, cracked the reactors open and tore a Rift at the world's core. He fused his followers with machine and shadow and named them the <b>Hollowed</b>.</p><p>He hunted the Starblood until none were left. Ithra went dark.</p>`},
  {ey:'Hatching',h:'The Last Starblood',b:`<p>Thirty years later, in a frozen stasis pod deep inside Hangar Nine, one egg cracks. Out tumbles <b>Tyko</b>: small, green, and very hungry.</p><p>Wrapped around the shell is a glowing collar, and inside it lives <b>Lyra</b>, the star-spirit who kept the egg warm all those years.</p><p><span class="who">LYRA:</span> "Hello, little one. I'm sorry you woke up in the dark. Let's go and turn the lights back on."</p>`}
 ],
 brief:[
  `<p><span class="who">LYRA:</span> "This is Hangar Nine, where your clan's ships used to launch. The Hollowed patrol it now. Their cores are stolen souls wrapped in iron, and your claws can set them free."</p><p><span class="who">LYRA:</span> "Smash the supply crates. Your clan hid food and Aether in them. And look for the old Starblood shrines. Each one wakes a power you were born with."</p>`,
  `<p><span class="who">LYRA:</span> "The Iron Armory. Malakar builds his green war-drones here and fuels them with Aether stolen from your clan's reactors. Jump to reach them, and grab every Star Fruit you see. You're still growing."</p>`,
  `<p><span class="who">LYRA:</span> "Orbital Dock Aeris. His fleet docks here before every raid, and an <b>Iron Warden</b> guards the gate. When it slams the deck, jump over the shockwave."</p>`,
  `<p><span class="who">LYRA:</span> "The Amber Foundry is where the Hollowed are made. Tyko... I found the clan records. Malakar wasn't just the Egg-Keeper. He kept <i>your</i> egg. He's the one who froze it."</p>`,
  `<p><span class="who">LYRA:</span> "The Null Citadel. Its gates were built to keep the Void <i>in</i>. He turned them inside out. Everything he has left is waiting here, so take every shard you can carry."</p>`,
  `<p><span class="who">MALAKAR:</span> "Little hatchling. I saved you for last. I thought one Starblood should see the end."</p><p><span class="who">LYRA:</span> "Don't listen to him. You're not the last of anything, Tyko. You're the first of what comes next."</p>`
 ],
 clear:[
  'The first souls rise free from their iron shells and drift into the dawn. Tyko watches them go, then sneezes out a tiny spark of starlight.',
  'The armory reactors cool and go dark. No more war-drones will launch from Ithra.',
  'The Iron Warden falls and Malakar\'s flagship burns on its moorings. The fleet will not fly tonight.',
  'The amber furnaces go cold. Deep in the foundry, Tyko finds a shelf of frozen eggs. Lyra marks the spot. "We\'ll come back for them. I promise."',
  'The Citadel gates crack open. Beyond them, the Rift pulses like a red heart.'
 ],
 ending:[
  {ey:'Malakar Falls',h:'The Rift Closes',b:`<p><span class="who">MALAKAR:</span> "I only wanted... to keep the light safe... somewhere no one could waste it..."</p><p>Tyko takes the deepest breath of his short life and roars. Every shard of Aether he gathered pours out of him, brighter than any star, and the wound in the world begins to seal.</p>`},
  {ey:'Epilogue',h:'Dawn Over Ithra',b:`<p>When Tyko wakes, the sky is blue. The reactors hum again, and the freed souls of the Hollowed drift upward like lanterns.</p><p>In the foundry, one by one, the frozen eggs begin to crack.</p><p><span class="who">LYRA:</span> "Well, little one. Looks like you have a lot of brothers and sisters to teach."</p>`}
 ]
};

const ETYPES={
 g:{w:80,h:165,hp:42,spd:260,dmg:10,score:100},
 b:{w:140,h:270,hp:130,spd:150,dmg:22,score:300,heavy:true},
 d:{w:70,h:70,hp:28,spd:0,dmg:8,score:150,fly:true},
 c:{w:80,h:160,hp:55,spd:0,dmg:9,score:250},
 B:{w:170,h:320,hp:420,spd:125,dmg:24,score:1500,heavy:true},
 h:{w:130,h:100,hp:45,spd:520,dmg:12,score:120}
};
function spawnEnemy(type,side){const T=ETYPES[type];let x=side<0?cam-120:cam+W+120;
  for(const s of solidRects()){const gx=s.x+s.w/2;if(Math.sign(x-gx)!==Math.sign(pl.x-gx))x=gx+Math.sign(pl.x-gx)*(s.w/2+90)}
  const e={type,x,y:T.fly?FY-360+Math.random()*130:FY,w:T.w,h:T.h,hp:T.hp*dm(),max:T.hp*dm(),vx:0,vy:0,face:-side,state:'walk',t:.6+Math.random()*.8,flash:0,seed:Math.random()*10,heavy:T.heavy,fly:T.fly,hy:0,score:T.score};
  e.hy=e.y;if(type==='c'){e.x=side<0?cam+260:cam+W-RSAFE-60;e.y=FY;e.fade=1;e.t=1.2;
    for(const g of solidRects()){const gx=g.x+g.w/2;if(Math.sign(e.x-gx)!==Math.sign(pl.x-gx))e.x=pl.x+(pl.x<gx?-1:1)*Math.max(200,Math.min(520,Math.abs(pl.x-gx)-80))}}
  en.push(e);burst(e.x,e.y-e.h/2,'#ff4fd8',14);sfxEnemy('spawn',e);if(type==='B'){showBanner('Iron Warden','Elite · jump its shockwaves',1.8);sfxEnemy('elite',e);shake=12}}
function spawnWave(list){list.forEach((t,i)=>spawnQ.push({t:i*.55,type:t,side:i%2?-1:1}))}

/* ---------- fx ---------- */
function burst(x,y,col,n,sp){sp=sp||600;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random()*.7);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,life:.35+Math.random()*.45,max:.8,col,sz:4+Math.random()*6,g:900})}}
function sparks(x,y,col,n,dir){for(let i=0;i<n;i++){const a=(dir>0?0:Math.PI)+(Math.random()-.5)*1.6,v=700+Math.random()*900;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.12+Math.random()*.16,max:.28,col,sz:3,g:600,streak:1})}}
function ring(x,y,col,r){rings.push({x,y,col,r:r||90,life:.28,max:.28})}
function dust(x,y){for(let i=0;i<8;i++)parts.push({x:x+(Math.random()-.5)*60,y,vx:(Math.random()-.5)*300,vy:-Math.random()*200,life:.4,max:.4,col:'rgba(220,210,255,.5)',sz:8,g:300})}
function souls(x,y){for(let i=0;i<6;i++)parts.push({x:x+(Math.random()-.5)*40,y,vx:(Math.random()-.5)*60,vy:-120-Math.random()*160,life:1.2,max:1.2,col:'#bff6ff',sz:7,g:-40})}
function ftext(x,y,s,col,big){texts.push({x,y,s,col,life:.8,big})}
function showBanner(t,sub,dur){banner={t,sub,life:dur||2.2,max:dur||2.2}}

/* ---------- combat ---------- */
function damage(e,d,kb){if(e.dead)return;d=Math.round(d);e.hp-=d;e.flash=.14;if(!e.isBoss)e.vx+=kb*(e.heavy?.35:1);
  if(pl){pl.hits++;pl.hitsT=1.8}const hy=e.y-e.h*.55;
  ftext(e.x,e.y-e.h-10,d,d>=30?'#ffd27a':'#fff',d>=30);burst(e.x,hy,'#ffd27a',6,500);sparks(e.x,hy,'#fff3c4',9,Math.sign(kb)||1);ring(e.x,hy,'#ffd27a',d>=30?140:90);sfxHit(d,e);buzz(8);hitStop=d>=30?.06:.035;
  if(e.hp<=0){if(e.isBoss){killBoss();return}
    e.dead=true;G.score+=e.score*(1+Math.min(4,Math.floor((pl?pl.hits:0)/10)));burst(e.x,e.y-e.h/2,'#ff4fd8',30,850);ring(e.x,e.y-e.h/2,'#ff4fd8',180);souls(e.x,e.y-e.h/2);sfxEnemyDie(e);buzz(14);shake=Math.max(shake,7);
    dropFrom(e);}}
function hurtPlayer(d,kx){const p=pl;if(p.inv>0||p.dead||G.state!=='play')return;
  if(p.shield>0){p.shield--;p.inv=.6;ring(p.x,p.y-95,'#8fc8ff',170);burst(p.x,p.y-95,'#8fc8ff',14,500);sfxBlock();buzz(15);ftext(p.x,p.y-200,'Blocked','#8fc8ff');return}
  d=Math.round(d);p.hp-=d;p.inv=.9;p.hurtT=.28;p.vx=kx;p.vy=-420;p.ground=false;p.atk=0;
  shake=14;flashT=.18;sfxHurt(d);buzz(45);p.hits=0;ftext(p.x,p.y-170,d,'#ff3d6e');burst(p.x,p.y-80,'#ff3d6e',12);
  if(p.hp<=0){p.hp=0;if(G.lives>0){G.lives--;p.dead=1;p.deadT=0;p.vx=0;p.inv=99;G.respawnT=1.8;buzz([60,40,60]);sfxPlayerDown()}else gameOver()}}

function updPlayer(dt){const p=pl;
  if(p.dead){const sy=p.sup||FY;p.vy+=3300*dt;p.y=Math.min(sy,p.y+p.vy*dt);if(p.y>=sy)p.vy=0;return}
  p.fury=Math.max(0,p.fury-dt);if(p.shield>0){p.shieldT-=dt;if(p.shieldT<=0)p.shield=0}
  p.inv=Math.max(0,p.inv-dt);p.atkCD-=dt;p.comboT-=dt;p.hurtT-=dt;p.dashCD-=dt;p.squash=Math.max(0,p.squash-dt*5);p.landT-=dt;
  p.hitsT-=dt;if(p.hitsT<=0)p.hits=0;
  for(const g of p.ghosts)g.life-=dt;p.ghosts=p.ghosts.filter(g=>g.life>0);
  let ax=0;if(p.hurtT<=0){if(K.left)ax-=1;if(K.right)ax+=1}
  if(p.atk>0){p.atk-=dt;ax*=.25}
  if(ax&&p.atk<=0)p.face=Math.sign(ax);
  if(p.hurtT<=0){const tgt=ax*640;p.vx+=(tgt-p.vx)*Math.min(1,dt*(p.ground?14:7))}
  p.dropT-=dt;if(P.down&&p.ground&&onPlatform(p)){p.dropT=.28;p.ground=false;p.y+=3}
  if(P.attack&&!p.ground&&K.down&&hasAb('slam')&&!p.slam&&p.hurtT<=0){p.slam=1;p.vy=2600;p.vx*=.3;p.atk=0;delete P.attack;sfxSlamStart();ring(p.x,p.y-90,'#ffb347',120)}
  if(P.jump&&p.hurtT<=0){if(p.ground){p.vy=-1300;p.ground=false;p.jumps=1;sfxJump(1);dust(p.x,p.y)}
    else if(p.jumps<2&&hasAb('double')){p.vy=-1100;p.jumps=2;sfxJump(2);burst(p.x,p.y-40,'#5ce1ff',12,350)}}
  if(P.attack&&p.atkCD<=0&&p.hurtT<=0){p.combo=p.comboT>0?(p.combo%3)+1:1;p.comboT=.6;p.atk=.22;p.atkCD=p.combo===3?.36:.17;p.hitDone=new Set();sfxSwing(p.combo);
    p.vx+=p.face*(p.combo===3?420:160);if(!p.ground)p.vy=Math.min(p.vy,-180)}
  if(P.dash&&hasAb('dash')&&p.dashCD<=0&&p.hurtT<=0){const dir=ax?Math.sign(ax):p.face;p.face=dir;p.dashT=.19;p.dashCD=.75;p.inv=Math.max(p.inv,.26);p.atk=0;
    sfxDash();buzz(10);if(p.ground)dust(p.x,p.y);burst(p.x,p.y-80,'#b48cff',10,420)}
  if(p.dashT>0){p.dashT-=dt;p.vx=p.face*1750;p.vy=Math.min(p.vy,0)*.5;p.ghostT-=dt;if(p.ghostT<=0){p.ghostT=.03;p.ghosts.push({x:p.x,y:p.y,face:p.face,life:.22})}}
  if(P.special&&hasAb('roar')&&p.en>=50&&p.hurtT<=0){p.en-=50;shots.push({x:p.x+p.face*70,y:p.y-85,vx:p.face*1600,vy:0,r:70,dmg:48*pdm(),friend:true,life:.85,pierce:true,hit:new Set(),col:'#5ce1ff',wave:true});
    sfxRoar();buzz(30);shake=10;burst(p.x+p.face*60,p.y-85,'#5ce1ff',20,700);ring(p.x+p.face*60,p.y-85,'#5ce1ff',220)}
  const x0=p.x,y0=p.y;if(p.dashT<=0)p.vy+=3300*dt;p.x+=p.vx*dt;geoPushX(p,x0);p.y+=p.vy*dt;
  const sup=geoLand(p,y0);
  if(sup!=null){if(!p.ground){if(p.vy>700){dust(p.x,sup);p.squash=1}if(!p.slam)sfxLand(p.vy);p.landT=.15;if(p.slam)slamLand(p,sup)}p.y=sup;p.vy=0;p.ground=true;p.jumps=0}else p.ground=false;
  p.sup=surfaceBelow(p.x,p.y);
  let mn=-120,mx=RW+120;if(lock){mn=cam+60;mx=cam+W-(touchy?RSAFE+80:60)}
  p.x=Math.max(mn,Math.min(mx,p.x));
  p.run+=Math.abs(p.vx)*dt*.02;
  if(p.atk>0&&p.atk<.18){const reach=p.combo===3?240:180,box={x:p.face>0?p.x-10:p.x-reach+10,y:p.y-190,w:reach,h:190};
    for(const e of allTargets())if(!p.hitDone.has(e)&&overlap(box,ebox(e))){p.hitDone.add(e);
      damage(e,(p.combo===3?26:14)*(1+G.lv*.06)*pdm(),p.face*(p.combo===3?750:260));p.en=Math.min(100,p.en+(p.combo===3?9:6))}
    hitBoxesWith(box,p.hitDone);if(!p.hitDone.has('geo')){p.hitDone.add('geo');clawGeo(box)}}
}
const allTargets=()=>boss&&!boss.dead&&boss.state!=='enter'?en.concat([boss]):en;

function gateClamp(e){e.x=Math.max(70,Math.min(RW-70,e.x));for(const s of solidRects()){if(e.y<=s.y+4&&s.y>0)continue;const l=s.x-e.w/2,r=s.x+s.w+e.w/2;if(e.x>l&&e.x<r){e.x=e.x<s.x+s.w/2?l:r;e.vx=0}}}
function updEnemy(e,dt){const dx=pl.x-e.x,ad=Math.abs(dx);e.flash-=dt;e.t-=dt;
  if(e.type==='d'){e.face=Math.sign(dx)||1;
    let tx=pl.x-e.face*440+Math.sin(lvT*1.3+e.seed)*90;const ty=e.hy+Math.sin(lvT*2.2+e.seed)*45;
    if(lock){if(pl.x-cam>W-RSAFE-300)tx=pl.x-440;tx=Math.max(cam+140,Math.min(cam+W-RSAFE,tx))}
    e.vx+=(tx-e.x)*dt*2.4;e.vx*=Math.pow(.15,dt);e.x+=e.vx*dt;gateClamp(e);e.y+=(ty-e.y)*Math.min(1,dt*2);
    if(e.t<=0&&(ad>1500||Math.abs(pl.y-e.y)>750))e.t=.5;if(e.t<=0){e.t=Math.max(1.4,2.8-G.lv*.25);const a=Math.atan2(pl.y-80-(e.y-35),pl.x-e.x),v=560+G.lv*30;
      shots.push({x:e.x,y:e.y-35,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:15,dmg:ETYPES.d.dmg*dm(),life:3.2,col:'#ff8a3a'});sfxEnemy('shot',e)}
    return}
  if(e.type==='c'){e.face=Math.sign(dx)||1;e.fade=Math.max(0,(e.fade||0)-dt*2);e.x+=e.vx*dt;gateClamp(e);e.vx*=Math.pow(.02,dt);
    if(ad<260&&e.t<.8&&!e.tp){e.tp=.35;burst(e.x,e.y-80,'#b48cff',18)}
    if(e.tp){e.tp-=dt;if(e.tp<=0){e.tp=0;const side=pl.x-cam>W/2?-1:1;e.x=pl.x+side*(520+Math.random()*200);e.x=Math.max(cam+160,Math.min(cam+W-RSAFE-40,e.x));for(const g of solidRects()){const gx=g.x+g.w/2;if(Math.sign(e.x-gx)!==Math.sign(pl.x-gx))e.x=pl.x+(pl.x<gx?-1:1)*Math.min(520,Math.abs(pl.x-gx)-60);}gateClamp(e);e.fade=1;e.t=1}}
    else if(e.t<=0&&ad<1500&&Math.abs(pl.y-e.y)<600){e.t=Math.max(1.6,2.8-G.lv*.15);const a0=Math.atan2(pl.y-90-(e.y-120),dx);
      for(let k=-1;k<=1;k++){const a=a0+k*.22;shots.push({x:e.x+e.face*40,y:e.y-120,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:17,dmg:ETYPES.c.dmg*dm(),life:3,col:'#b48cff'})}sfxEnemy('shot',e)}
    return}
  if(e.type==='h'){if(e.state!=='leap')e.face=Math.sign(dx)||1;
    if(e.state==='walk'){if(ad>280)e.vx+=(e.face*520*(1+G.lv*.04)-e.vx)*Math.min(1,dt*6);else{e.vx*=Math.pow(.02,dt);if(e.t<=0){e.state='wind';e.t=.26+Math.random()*.16}}}
    else if(e.state==='wind'){e.vx*=Math.pow(.01,dt);if(e.t<=0){e.state='leap';e.t=.36;e.vx=e.face*1150;e.hitP=false;sfxEnemy('leap',e)}}
    else if(e.state==='leap'){if(!e.hitP&&overlap(ebox(e),pbox())){e.hitP=true;hurtPlayer(ETYPES.h.dmg*dm(),e.face*520)}e.vx*=Math.pow(.25,dt);if(e.t<=0){e.state='walk';e.t=.5+Math.random()*.4}}
    e.x+=e.vx*dt;gateClamp(e);if(lock&&touchy){const lim=cam+W-RSAFE+40;if(e.x<lim)e.in=1;if(e.in&&e.x>lim){e.x=lim;if(e.vx>0)e.vx=0}}return}
  const T=ETYPES[e.type],hv=e.type==='b'||e.type==='B',range=e.type==='B'?240:hv?200:130;
  if(e.state==='walk'){e.face=Math.sign(dx)||1;
    if(ad>range)e.vx+=(e.face*T.spd*(1+G.lv*.05)-e.vx)*Math.min(1,dt*5);else{e.vx*=Math.pow(.01,dt);if(e.t<=0){e.state='wind';e.t=e.type==='B'?.75:hv?.62:.42}}}
  else if(e.state==='wind'){e.vx*=Math.pow(.01,dt);if(e.t<=0){if(!hv)sfxEnemy('swipe',e);e.state='swing';e.t=.2;e.hitP=false;e.vx+=e.face*(hv?120:260);if(hv){shake=Math.max(shake,8);dust(e.x+e.face*120,e.y);sfxEnemy('smash',e)}
      if(e.type==='B'){for(const d of[-1,1])hz.push({kind:'quake',x:e.x+d*90,dir:d,v:820,t:0,act:1.5});shake=16}}}
  else if(e.state==='swing'){if(!e.hitP){const reach=e.type==='B'?270:hv?230:150,box={x:e.face>0?e.x:e.x-reach,y:e.y-e.h,w:reach,h:e.h};
      if(overlap(box,pbox())){e.hitP=true;hurtPlayer(T.dmg*dm(),e.face*(hv?900:450))}}
    if(e.t<=0){e.state='walk';e.t=(e.type==='B'?1.6:hv?1.3:.8)+Math.random()*.7}}
  e.x+=e.vx*dt;if(e.state!=='walk')e.vx*=Math.pow(.05,dt);gateClamp(e);
  /* once on screen during a wave, ground enemies stay out of the strip under the touch buttons */
  if(lock&&touchy){const lim=cam+W-RSAFE+40;if(e.x<lim)e.in=1;if(e.in&&e.x>lim){e.x=lim;if(e.vx>0)e.vx=0}}
}
</script>
<script>
"use strict";
/* ---------- boss: Malakar, the Void Sovereign ---------- */
const arenaCam=()=>Math.max(0,RW-W);
function startBoss(){lock=true;S.boom();sfxBossRoar();musicFor();shake=16;const ac=arenaCam();
  boss={isBoss:true,x:ac+W-RSAFE-160,y:GY,w:190,h:330,hp:3600,max:3600,face:-1,state:'enter',t:2.6,flash:0,vx:0,phase:1,dy:-800,hov:0,last:'',fire:0,left:0};
  showBanner('Malakar','The Void Sovereign',2.6)}
function bclamp(x){return Math.max(cam+220,Math.min(cam+W-RSAFE-110,x))}
function chooseAttack(b){let o=['dash','barrage','rift'];if(b.phase>=2)o.push('beam','beam','summon');
  o=o.filter(a=>a!==b.last);let a=o[Math.floor(Math.random()*o.length)];if(a==='summon'&&en.length>=2)a='barrage';b.last=a;
  const k=b.phase===3?.6:.85;
  if(a==='dash'){b.state='dashWind';b.t=.7*k;b.dash2=false;S.warn()}
  else if(a==='barrage'){b.state='barrage';b.left=b.phase>1?16:10;b.fire=0;b.spin=Math.random()*6}
  else if(a==='rift'){b.state='cast';b.t=.6;const xs=[pl.x,pl.x-300,pl.x+300];if(b.phase===3)xs.push(pl.x-600,pl.x+600);
    xs.forEach((x,i)=>hz.push({kind:'pillar',x:bclamp(x),t:.9+i*.08,act:.45,w:160}));S.warn()}
  else if(a==='beam'){b.state='cast';b.t=1.2;const low=Math.random()<.5;hz.push({kind:'beam',y:low?GY-60:GY-215,low,t:1.05*k+.2,act:.6});S.warn()}
  else if(a==='summon'){b.state='cast';b.t=.9;spawnEnemy('d',-1);spawnEnemy('d',1);if(b.phase===3)spawnEnemy('c',1)}}
function updBoss(b,dt){b.flash-=dt;b.t-=dt;
  const r=b.hp/b.max,ph=r<.25?3:r<.55?2:1;
  if(ph!==b.phase&&b.state!=='enter'){b.phase=ph;showBanner(ph===2?'Malakar Unleashed':'The Void Consumes',ph===2?'He calls the Hollowed to his side':'Final phase',1.8);
    shake=22;S.boom();sfxBossRoar();b.state='idle';b.t=1.2;burst(b.x,b.y-170,'#ff3d6e',40,1000);hz=hz.filter(h=>h.kind!=='beam')}
  if(b.state==='enter'){b.dy+=(0-b.dy)*Math.min(1,dt*2.2);if(b.t<=0){b.state='idle';b.t=1;b.dy=0}return}
  b.hov=Math.sin(lvT*2)*16;
  if(b.state!=='dash')b.face=Math.sign(pl.x-b.x)||-1;
  const k=b.phase===3?.6:.85;
  if(b.state==='idle'){let side=b.x>pl.x?1:-1,tx=bclamp(pl.x+side*520);if(Math.abs(tx-pl.x)<320)tx=bclamp(pl.x-side*520);b.x+=(tx-b.x)*Math.min(1,dt*1.3);if(b.t<=0)chooseAttack(b)}
  else if(b.state==='dashWind'){if(Math.random()<.5)burst(b.x,b.y-160,'#ff3d6e',2,300);if(b.t<=0){b.state='dash';b.t=.95;b.vx=b.face*2000;S.boom();b.hitP=false}}
  else if(b.state==='dash'){b.x+=b.vx*dt;parts.push({x:b.x,y:b.y-150+(Math.random()-.5)*200,vx:-b.vx*.1,vy:0,life:.3,max:.3,col:'#ff3d6e',sz:10,g:0});
    if(!b.hitP&&overlap(ebox(b),pbox())){b.hitP=true;hurtPlayer(28,b.face*1000)}
    if(b.t<=0||b.x<cam+180||b.x>cam+W-RSAFE-110){b.x=bclamp(b.x);shake=10;
      if(b.phase===3&&!b.dash2){b.dash2=true;b.face*=-1;b.state='dashWind';b.t=.35}else{b.state='idle';b.t=1.1*k}}}
  else if(b.state==='barrage'){b.fire-=dt;if(b.fire<=0){b.fire=.1;b.left--;const a0=Math.atan2(pl.y-90-(b.y-260),pl.x-b.x);
      const a=a0+Math.sin(b.spin+b.left*.7)*.55;shots.push({x:b.x+b.face*60,y:b.y-260+b.hov,vx:Math.cos(a)*620,vy:Math.sin(a)*620,r:20,dmg:14,life:3.5,col:'#ff3d6e'});S.shot();
      if(b.left<=0){b.state='idle';b.t=1.2*k}}}
  else if(b.state==='cast'){if(b.t<=0){b.state='idle';b.t=1*k}}
  if(b.state!=='dash'&&b.state!=='idle'&&overlap(ebox(b),pbox()))hurtPlayer(5,(pl.x<b.x?-1:1)*800);
}
function killBoss(){const b=boss;b.dead=true;bossDone=true;G.score+=10000;shake=30;S.boom();hz=[];shots=shots.filter(s=>s.friend);
  en.forEach(e=>{e.dead=true;burst(e.x,e.y-e.h/2,'#ff4fd8',20)});en=[];spawnQ=[];
  for(let i=0;i<6;i++)setTimeout(()=>{burst(b.x+(Math.random()-.5)*220,b.y-Math.random()*330,i%2?'#ff3d6e':'#5ce1ff',40,1100);souls(b.x,b.y-170);S.boom();shake=20},i*280);
  showBanner('Malakar Falls','',3);doneT=3.4;sfxBossDie();musicStop(2.5)}

/* ---------- world update ---------- */
const circleBox=(s,b)=>{const cx=Math.max(b.x,Math.min(s.x,b.x+b.w)),cy=Math.max(b.y,Math.min(s.y,b.y+b.h));return(s.x-cx)**2+(s.y-cy)**2<s.r*s.r};
function atkBox(){const p=pl;if(!(p.atk>0))return null;const reach=p.combo===3?240:180;return{x:p.face>0?p.x-10:p.x-reach+10,y:p.y-190,w:reach,h:190}}

<script>

const CW=2560;           /* one map cell = 2560 x 1080 world units; rooms are whole numbers of cells */
const TANKS=[['high','laser'],['crack','slam'],['high','plasma'],['laser','high'],['slam','plasma'],['crack','high']];
function hstr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)%2147483646+1}
/* every area follows the same Super Metroid shape: entry → tall shaft hub with save / item / shrine side rooms → lockdown arena → gate corridor → arena → elevator (or boss) */
function buildArea(a){const hs=3+(a===2||a===4?1:0),bot=hs-1,id=k=>a+'-'+k,R=[];
  const room=(k,gx,gy,w,h,kind,doors)=>R.push({id:id(k),a,k,gx,gy,w,h,kind,doors:doors.map(([side,row,to])=>({side,row,to:id(to)}))});
  room(0,0,0,2,1,a===0?'start':'liftUp',[['R',0,1]]);
  room(1,2,0,1,hs,'shaft',[['L',0,0],['R',0,2],['R',1,3],['L',bot,4],['R',bot,5]]);
  room(2,3,0,1,1,'save',[['L',0,1]]);

const AREAS=LV.map((L,a)=>buildArea(a));
const ROOMS={};AREAS.forEach(r=>r.forEach(o=>ROOMS[o.id]=o));
/* matching door on the other side of a connection */
function partnerDoor(room,door){const t=ROOMS[door.to],wr=room.gy+door.row;return t.doors.find(d=>d.to===room.id&&d.side!==door.side&&t.gy+d.row===wr)||t.doors.find(d=>d.to===room.id)}

function genRoom(o){if(o.gen)return o;const L=LV[o.a],a=o.a,r=rng(hstr(o.id)),RW=o.w*CW,RH=o.h*H,FY=(o.h-1)*H+GY;
  const S=[],plats=[],zones=[];o.RW=RW;o.RH=RH;o.FY=FY;
  S.push({x:-400,y:FY,w:RW+800,h:600,k:'floor'});S.push({x:-400,y:-400,w:RW+800,h:400,k:'ceil'});
  for(const side of['L','R']){const ds=o.doors.filter(d=>d.side===side).map(d=>d.row).sort((p,q)=>p-q);let y=-400;const x=side==='L'?-400:RW-40;
    for(const row of ds){const top=row*H+GY-300;if(top>y)S.push({x,y,w:440,h:top-y,k:'wall'});y=row*H+GY;
      if(row<o.h-1)S.push({x:side==='L'?-400:RW-340,y:row*H+GY,w:740,h:44,k:'ledge'})}

  o.solids=S;o.plats=plats;o.zones=zones;o.gates=[];o.cages=[];o.items=[];o.crates=[];o.coins=[];o.spawns=[];o.props=[];o.lamps=[];o.vents=[];o.waves=null;

        for(let t=0;t<tiers;t++){const w=240+Math.floor(r()*3)*80;plats.push({x:Math.round(px),y:FY-190-t*170,w});px+=(r()<.5?-1:1)*(130+r()*70)}}x+=760+r()*620}}
  /* props, lamps and vents along the bottom floor */
  const ks=PROPK[L.theme];let x=560;while(x<RW-560){if(free(x)&&o.kind!=='save'){o.props.push({x,k:ks[Math.floor(r()*ks.length)],v:Math.floor(r()*2),fy:FY})}x+=520+r()*620}
  for(let row=0;row<o.h;row++){let lx=380+r()*300;while(lx<RW-300){const v=r();o.lamps.push({x:lx,y:row*H+150+r()*100,y0:row*H,fy:row*H+GY,k:v<.18?'alarm':v<.3?'broken':'lamp',s:r()});lx+=640+r()*560}}

  if(o.kind==='start'||o.kind==='liftUp'){if(o.kind==='liftUp')o.lift={x:420,dir:-1,to:(a-1)+'-8'};sp('g',RW*.62);sp('d',RW*.8);if(a>=2)sp('h',RW*.9);
    o.crates.push(RW*.42);o.coins.push(RW*.7)}
  else if(o.kind==='save'){o.station={x:RW*.5,t:0};o.plats.length=0}
  else if(o.kind==='item'){const t=TANKS[a][0],tid=a+'-0';o.plats.length=0;
    if(t==='high'){o.plats.push({x:RW*.5-130,y:GY-410,w:260,iso:1});o.items.push({type:'tank',id:tid,x:RW*.5,y:GY-480})}
    else{const c={x:RW*.5,kind:t,hp:t==='plasma'?3:1,broken:0};o.cages.push(c);o.items.push({type:'tank',id:tid,x:RW*.5,y:GY-80,cage:c})}sp('d',RW*.7)}
  else if(o.kind==='shrine'){o.shrine={x:520,ab:a<5?ABIL[a].id:null};if(a===5)o.shrine=null;sp('g',RW*.55);sp('g',RW*.75);sp('d',RW*.65);o.crates.push(RW*.35);o.coins.push(RW*.45);
    o.items.push({type:'egg',id:'egg'+a,x:RW*.86,y:GY-470})}

<script>
