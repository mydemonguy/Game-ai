/* Layout: one 1920x1080 stage scaled to fit, HTML overlays for story and menus, thumb controls pinned to the lower corners */
:root{
  --void:#07060f; --panel:rgba(12,10,26,.86); --ink:#ece7ff; --dim:#9d97bd;
  --aether:#5ce1ff; --ember:#ff8a4c; --rune:#b48cff; --blood:#ff3d6e;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--void)}
#c{display:block;background:#000;image-rendering:auto}
button{font-family:var(--ui);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--aether);outline-offset:3px}

/* overlay screens */
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;z-index:5;
  background:radial-gradient(ellipse at 50% 40%,rgba(30,20,70,.55),rgba(5,4,12,.9) 70%)}
.card{max-width:min(760px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:clamp(18px,3vw,36px);box-sizing:border-box;
  background:var(--panel);border:1px solid rgba(180,140,255,.35);box-shadow:0 0 60px rgba(92,225,255,.12),inset 0 0 40px rgba(180,140,255,.06)}
.eyebrow{margin:0;font-size:clamp(11px,1.4vw,14px);letter-spacing:.32em;text-transform:uppercase;color:var(--aether)}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(46px,9vw,120px);line-height:.95;letter-spacing:.06em;text-wrap:balance;
  background:linear-gradient(180deg,#fff 10%,var(--aether) 55%,var(--rune));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(92,225,255,.35))}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,44px);line-height:1.1;letter-spacing:.04em;text-wrap:balance}
.body{font-size:clamp(14px,1.9vw,18px);line-height:1.6;color:#d6d0f2;max-width:62ch}
.body p{margin:0 0 .8em}
.body .who{color:var(--rune);font-weight:700;letter-spacing:.08em}
.tag{margin:0;font-family:var(--display);font-size:clamp(14px,2vw,20px);color:var(--dim);font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{font-size:clamp(14px,1.8vw,18px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:12px 22px;
  background:linear-gradient(180deg,rgba(92,225,255,.18),rgba(92,225,255,.05));border:1px solid var(--aether);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.btn.alt{border-color:var(--rune);background:rgba(180,140,255,.08)}
.btn:active{transform:translateY(1px);background:rgba(92,225,255,.3)}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lvgrid button{text-align:left;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(180,140,255,.3);font-size:14px;line-height:1.3}
.lvgrid button b{display:block;font-family:var(--display);font-size:16px;color:var(--ink)}
.lvgrid button span{color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.lvgrid button:disabled{opacity:.35;cursor:not-allowed}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.keys kbd{font-family:var(--ui);font-weight:700;color:var(--aether)}

/* touch controls */
#pad{position:fixed;inset:0;z-index:3;pointer-events:none}
#pad button{pointer-events:auto;position:absolute;border-radius:50%;border:2px solid rgba(236,231,255,.35);background:rgba(20,16,44,.45);
  font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;touch-action:none;backdrop-filter:blur(2px)}
#pad button.on{background:rgba(92,225,255,.35);border-color:var(--aether)}
#pad .l{left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:96px;height:96px}
#pad .r{left:calc(140px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:96px;height:96px}
#pad .atk{right:calc(130px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:104px;height:104px;border-color:var(--ember)}
#pad .jmp{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(110px + env(safe-area-inset-bottom,0px));width:96px;height:96px}
#pad .sp{right:calc(140px + env(safe-area-inset-right,0px));bottom:calc(148px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-color:var(--aether);font-size:26px}
#pad .ps{right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));width:52px;height:52px;font-size:18px;border-radius:12px}
#rotate{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--void);font-family:var(--display);font-size:22px}
#rotate small{font-family:var(--ui);color:var(--dim);font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
const C=document.getElementById('c'),X=C.getContext('2d');

function fit(){const w=innerWidth,h=innerHeight,s=Math.min(w/W,h/H);C.style.width=W*s+'px';C.style.height=H*s+'px';
  document.getElementById('rotate').hidden=!(touchy&&h>w*1.05);}

let AC=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function sfx(f,d,t,v,slide){if(!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),n+d);g.gain.setValueAtTime(v||.06,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
const S={hit:()=>sfx(240,.09,'square',.06,-150),swing:()=>sfx(700,.08,'sawtooth',.025,-500),jump:()=>sfx(320,.12,'triangle',.06,320),
  hurt:()=>sfx(140,.22,'sawtooth',.08,-80),special:()=>{sfx(180,.45,'sawtooth',.07,1100);sfx(90,.5,'sine',.1,200)},die:()=>sfx(110,.35,'square',.06,-70),
  pick:()=>sfx(660,.18,'sine',.08,600),shot:()=>sfx(880,.09,'sine',.025,-500),boom:()=>sfx(60,.6,'sawtooth',.12,-20),warn:()=>sfx(420,.25,'triangle',.05,-100)};

const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyJ:'attack',KeyX:'attack',KeyK:'special',KeyC:'special'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k&&G.state==='play'){if(!K[k])P[k]=1;K[k]=1;e.preventDefault()}
  if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat)togglePause();});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)K[k]=0});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
  const dn=e=>{e.preventDefault();initAudio();if(!K[k])P[k]=1;K[k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const up=e=>{e.preventDefault();K[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);});
function clearInput(){for(const k in K)K[k]=0;for(const k in P)delete P[k];document.querySelectorAll('[data-k]').forEach(b=>b.classList.remove('on'))}

function damage(e,d,kb){if(e.dead)return;d=Math.round(d);e.hp-=d;e.flash=.12;if(!e.isBoss)e.vx+=kb*(e.heavy?.35:1);

function hurtPlayer(d,kx){const p=pl;if(p.inv>0||G.state!=='play')return;d=Math.round(d);p.hp-=d;p.inv=.9;p.hurtT=.28;p.vx=kx;p.vy=-420;p.ground=false;p.atk=0;
  shake=14;flashT=.18;S.hurt();ftext(p.x,p.y-170,d,'#ff3d6e');burst(p.x,p.y-80,'#ff3d6e',12);

function updPlayer(dt){const p=pl,L=LV[G.lv];

  if(P.jump&&p.hurtT<=0){if(p.ground){p.vy=-1300;p.ground=false;p.jumps=1;S.jump();dust(p.x,GY)}
    else if(p.jumps<2){p.vy=-1100;p.jumps=2;S.jump();burst(p.x,p.y-40,'#5ce1ff',12,350)}}
  if(P.attack&&p.atkCD<=0&&p.hurtT<=0){p.combo=p.comboT>0?(p.combo%3)+1:1;p.comboT=.6;p.atk=.22;p.atkCD=p.combo===3?.36:.17;p.hitDone=new Set();S.swing();
    p.vx+=p.face*(p.combo===3?420:160);if(!p.ground)p.vy=Math.min(p.vy,-180)}
  if(P.special&&p.en>=50&&p.hurtT<=0){p.en-=50;shots.push({x:p.x+p.face*70,y:p.y-85,vx:p.face*1600,vy:0,r:70,dmg:48,friend:true,life:.85,pierce:true,hit:new Set(),col:'#5ce1ff',wave:true});
    S.special();shake=10;burst(p.x+p.face*60,p.y-85,'#5ce1ff',20,700)}
  p.vy+=3300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.y>=GY){if(!p.ground&&p.vy>700)dust(p.x,GY);p.y=GY;p.vy=0;p.ground=true;p.jumps=0}
  let mn=60,mx=L.len;if(lock){mn=cam+60;mx=cam+W-60}
  p.x=Math.max(mn,Math.min(mx,p.x));
  p.run+=Math.abs(p.vx)*dt*.02;
  if(p.atk>0&&p.atk<.18){const reach=p.combo===3?240:180,box={x:p.face>0?p.x-10:p.x-reach+10,y:p.y-190,w:reach,h:190};
    for(const e of allTargets())if(!p.hitDone.has(e)&&overlap(box,ebox(e))){p.hitDone.add(e);
      damage(e,(p.combo===3?26:14)*(1+G.lv*.06),p.face*(p.combo===3?750:260));p.en=Math.min(100,p.en+(p.combo===3?9:6))}}
}
const allTargets=()=>boss&&!boss.dead&&boss.state!=='enter'?en.concat([boss]):en;

function updEnemy(e,dt){const dx=pl.x-e.x,ad=Math.abs(dx);e.flash-=dt;e.t-=dt;
  if(e.type==='d'){e.face=Math.sign(dx)||1;
    const tx=pl.x-e.face*440+Math.sin(lvT*1.3+e.seed)*90,ty=e.hy+Math.sin(lvT*2.2+e.seed)*45;
    e.vx+=(tx-e.x)*dt*2.4;e.vx*=Math.pow(.15,dt);e.x+=e.vx*dt;e.y+=(ty-e.y)*Math.min(1,dt*2);
    if(e.t<=0){e.t=Math.max(1.3,2.3-G.lv*.15);const a=Math.atan2(pl.y-80-(e.y-35),pl.x-e.x),v=560+G.lv*30;
      shots.push({x:e.x,y:e.y-35,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:15,dmg:ETYPES.d.dmg*dm(),life:3.2,col:'#ff4fd8'});S.shot()}
    return}
  if(e.type==='c'){e.face=Math.sign(dx)||1;e.fade=Math.max(0,(e.fade||0)-dt*2);e.x+=e.vx*dt;e.vx*=Math.pow(.02,dt);
    if(ad<260&&e.t<.8&&!e.tp){e.tp=.35;burst(e.x,e.y-80,'#b48cff',18)}
    if(e.tp){e.tp-=dt;if(e.tp<=0){e.tp=0;const side=pl.x-cam>W/2?-1:1;e.x=pl.x+side*(520+Math.random()*200);e.x=Math.max(cam+120,Math.min(cam+W-120,e.x));e.fade=1;e.t=1}}
    else if(e.t<=0){e.t=Math.max(1.6,2.8-G.lv*.15);const a0=Math.atan2(pl.y-90-(e.y-120),dx);
      for(let k=-1;k<=1;k++){const a=a0+k*.22;shots.push({x:e.x+e.face*40,y:e.y-120,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:17,dmg:ETYPES.c.dmg*dm(),life:3,col:'#b48cff'})}S.shot()}
    return}
  const T=ETYPES[e.type],range=e.type==='b'?200:130;
  if(e.state==='walk'){e.face=Math.sign(dx)||1;
    if(ad>range)e.vx+=(e.face*T.spd*(1+G.lv*.05)-e.vx)*Math.min(1,dt*5);else{e.vx*=Math.pow(.01,dt);if(e.t<=0){e.state='wind';e.t=e.type==='b'?.62:.42}}}
  else if(e.state==='wind'){e.vx*=Math.pow(.01,dt);if(e.t<=0){e.state='swing';e.t=.2;e.hitP=false;e.vx+=e.face*(e.type==='b'?120:260);if(e.type==='b'){shake=Math.max(shake,8);dust(e.x+e.face*120,GY);S.boom()}}}
  else if(e.state==='swing'){if(!e.hitP){const reach=e.type==='b'?230:150,box={x:e.face>0?e.x:e.x-reach,y:e.y-e.h,w:reach,h:e.h};
      if(overlap(box,pbox())){e.hitP=true;hurtPlayer(T.dmg*dm(),e.face*(e.type==='b'?900:450))}}
    if(e.t<=0){e.state='walk';e.t=(e.type==='b'?1.3:.8)+Math.random()*.7}}
  e.x+=e.vx*dt;if(e.state!=='walk')e.vx*=Math.pow(.05,dt);
}

<script>
"use strict";
/* ---------- boss: Malakar, the Void Sovereign ---------- */
const arenaCam=()=>LV[G.lv].len-W+120;
function startBoss(){lock=true;S.boom();shake=16;const ac=arenaCam();
  boss={isBoss:true,x:ac+W-380,y:GY,w:190,h:330,hp:2400,max:2400,face:-1,state:'enter',t:2.6,flash:0,vx:0,phase:1,dy:-800,hov:0,last:'',fire:0,left:0};
  showBanner('Malakar','The Void Sovereign',2.6)}
function bclamp(x){return Math.max(cam+220,Math.min(cam+W-220,x))}
function chooseAttack(b){let o=['dash','barrage','rift'];if(b.phase>=2)o.push('beam','beam','summon');
  o=o.filter(a=>a!==b.last);let a=o[Math.floor(Math.random()*o.length)];if(a==='summon'&&en.length>=2)a='barrage';b.last=a;
  const k=b.phase===3?.7:1;
  if(a==='dash'){b.state='dashWind';b.t=.7*k;b.dash2=false;S.warn()}
  else if(a==='barrage'){b.state='barrage';b.left=b.phase>1?16:10;b.fire=0;b.spin=Math.random()*6}
  else if(a==='rift'){b.state='cast';b.t=.6;const xs=[pl.x,pl.x-300,pl.x+300];if(b.phase===3)xs.push(pl.x-600,pl.x+600);
    xs.forEach((x,i)=>hz.push({kind:'pillar',x:bclamp(x),t:.9+i*.08,act:.45,w:160}));S.warn()}
  else if(a==='beam'){b.state='cast';b.t=1.2;const low=Math.random()<.5;hz.push({kind:'beam',y:low?GY-60:GY-215,low,t:1.05*k+.2,act:.6});S.warn()}
  else if(a==='summon'){b.state='cast';b.t=.9;spawnEnemy('d',-1);spawnEnemy('d',1);if(b.phase===3)spawnEnemy('c',1)}}
function updBoss(b,dt){b.flash-=dt;b.t-=dt;
  const r=b.hp/b.max,ph=r<.25?3:r<.55?2:1;
  if(ph!==b.phase&&b.state!=='enter'){b.phase=ph;showBanner(ph===2?'Malakar Unleashed':'The Void Consumes',ph===2?'He calls the Hollowed to his side':'Final phase',1.8);
    shake=22;S.boom();b.state='idle';b.t=1.2;burst(b.x,b.y-170,'#ff3d6e',40,1000);hz=hz.filter(h=>h.kind!=='beam')}
  if(b.state==='enter'){b.dy+=(0-b.dy)*Math.min(1,dt*2.2);if(b.t<=0){b.state='idle';b.t=1;b.dy=0}return}
  b.hov=Math.sin(lvT*2)*16;
  if(b.state!=='dash')b.face=Math.sign(pl.x-b.x)||-1;
  const k=b.phase===3?.7:1;
  if(b.state==='idle'){const side=b.x>pl.x?1:-1,tx=bclamp(pl.x+side*520);b.x+=(tx-b.x)*Math.min(1,dt*1.3);if(b.t<=0)chooseAttack(b)}
  else if(b.state==='dashWind'){if(Math.random()<.5)burst(b.x,b.y-160,'#ff3d6e',2,300);if(b.t<=0){b.state='dash';b.t=.95;b.vx=b.face*2000;S.boom();b.hitP=false}}
  else if(b.state==='dash'){b.x+=b.vx*dt;parts.push({x:b.x,y:b.y-150+(Math.random()-.5)*200,vx:-b.vx*.1,vy:0,life:.3,max:.3,col:'#ff3d6e',sz:10,g:0});
    if(!b.hitP&&overlap(ebox(b),pbox())){b.hitP=true;hurtPlayer(22,b.face*1000)}
    if(b.t<=0||b.x<cam+180||b.x>cam+W-180){b.x=bclamp(b.x);shake=10;
      if(b.phase===3&&!b.dash2){b.dash2=true;b.face*=-1;b.state='dashWind';b.t=.35}else{b.state='idle';b.t=1.1*k}}}
  else if(b.state==='barrage'){b.fire-=dt;if(b.fire<=0){b.fire=.1;b.left--;const a0=Math.atan2(pl.y-90-(b.y-260),pl.x-b.x);
      const a=a0+Math.sin(b.spin+b.left*.7)*.55;shots.push({x:b.x+b.face*60,y:b.y-260+b.hov,vx:Math.cos(a)*620,vy:Math.sin(a)*620,r:20,dmg:11,life:3.5,col:'#ff3d6e'});S.shot();
      if(b.left<=0){b.state='idle';b.t=1.2*k}}}
  else if(b.state==='cast'){if(b.t<=0){b.state='idle';b.t=1*k}}
  if(b.state!=='dash'&&overlap(ebox(b),pbox()))hurtPlayer(10,(pl.x<b.x?-1:1)*700);
}
function killBoss(){const b=boss;b.dead=true;bossDone=true;G.score+=10000;shake=30;S.boom();hz=[];shots=shots.filter(s=>s.friend);
  en.forEach(e=>{e.dead=true;burst(e.x,e.y-e.h/2,'#ff4fd8',20)});en=[];spawnQ=[];
  for(let i=0;i<6;i++)setTimeout(()=>{burst(b.x+(Math.random()-.5)*220,b.y-Math.random()*330,i%2?'#ff3d6e':'#5ce1ff',40,1100);souls(b.x,b.y-170);S.boom();shake=20},i*280);
  showBanner('Malakar Falls','',3);doneT=3.4}

/* ---------- world update ---------- */
const circleBox=(s,b)=>{const cx=Math.max(b.x,Math.min(s.x,b.x+b.w)),cy=Math.max(b.y,Math.min(s.y,b.y+b.h));return(s.x-cx)**2+(s.y-cy)**2<s.r*s.r};
function atkBox(){const p=pl;if(!(p.atk>0))return null;const reach=p.combo===3?240:180;return{x:p.face>0?p.x-10:p.x-reach+10,y:p.y-190,w:reach,h:190}}
function updShots(dt){const ab=atkBox();
  for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(!s.friend&&ab&&circleBox(s,ab)){s.friend=true;s.vx=pl.face*Math.abs(s.vx)*1.5+pl.face*200;s.vy*=-.4;s.hit=new Set();s.dmg*=2.2;s.col='#5ce1ff';s.life=1.5;S.hit();ftext(s.x,s.y-30,'Deflect','#5ce1ff');pl.en=Math.min(100,pl.en+8);continue}
    if(s.friend){for(const e of allTargets()){if(s.hit.has(e))continue;if(circleBox(s,ebox(e))){s.hit.add(e);damage(e,s.dmg*(1+G.lv*.05),Math.sign(s.vx)*500);if(!s.pierce){s.life=0;break}}}}
    else if(circleBox(s,pbox())){hurtPlayer(s.dmg,Math.sign(s.vx)*380);s.life=0;burst(s.x,s.y,s.col,10)}
    if(s.y>GY){s.life=0;burst(s.x,GY,s.col,6,300)}
    if(s.x<cam-300||s.x>cam+W+300)s.life=0;
    if(Math.random()<.4)parts.push({x:s.x,y:s.y,vx:0,vy:0,life:.25,max:.25,col:s.col,sz:s.wave?14:6,g:0})}
  shots=shots.filter(s=>s.life>0)}
function updHz(dt){for(const h of hz){if(h.t>0){h.t-=dt;if(h.t<=0){S.boom();shake=Math.max(shake,h.kind==='beam'?14:9);if(h.kind==='pillar')burst(h.x,GY,'#ff3d6e',24,900)}continue}
    h.act-=dt;if(h.hitP)continue;const pb=pbox();

<script>

function shape(o,ox,base,col,glow,deep){const x=o.x-ox,w=o.w,h=o.h;if(x>W+50||x+w<-50)return;X.fillStyle=col;X.beginPath();

function drawHollow(e){const big=e.type==='b',s=big?1.35:1;shadow(e.x,big?70:44);X.save();X.translate(e.x,e.y);X.scale(e.face*s,s);

<script>
"use strict";
/* ---------- world + HUD rendering ---------- */
const FD='"Cinzel", Georgia, serif',FU='"Chakra Petch", "Segoe UI", sans-serif';
function drawGate(L){const gx=L.len-150,open=waveI>=L.waves.length;X.save();X.translate(gx,GY);
  X.fillStyle=L.mid;X.fillRect(-120,-380,40,380);X.fillRect(80,-380,40,380);X.fillRect(-140,-410,280,40);
  X.globalCompositeOperation='lighter';X.strokeStyle=L.glow;X.lineWidth=10;X.globalAlpha=open?.85:.2;
  X.beginPath();X.ellipse(0,-190,70,170,0,0,7);X.stroke();
  if(open){for(let i=0;i<3;i++){X.globalAlpha=.25;X.beginPath();X.ellipse(0,-190,70-i*18,170-i*40,Math.sin(lvT*2+i)*.2,0,7);X.stroke()}
    X.globalAlpha=.6;X.fillStyle=L.glow;X.font=`700 30px ${FU}`;X.textAlign='center';X.fillText('GATE',0,-430)}
  X.restore();X.globalAlpha=1}
function drawHz(){for(const h of hz){if(h.kind==='pillar'){if(h.t>0){X.fillStyle='#ff3d6e';X.globalAlpha=.25+.25*Math.sin(lvT*30);X.beginPath();X.ellipse(h.x,GY+6,h.w/2,18,0,0,7);X.fill();X.globalAlpha=1}
      else{X.save();X.globalCompositeOperation='lighter';const a=Math.min(1,h.act/.2);X.globalAlpha=a;const g=X.createLinearGradient(h.x-h.w/2,0,h.x+h.w/2,0);
        g.addColorStop(0,'rgba(255,61,110,0)');g.addColorStop(.5,'#ffd0dc');g.addColorStop(1,'rgba(255,61,110,0)');X.fillStyle=g;X.fillRect(h.x-h.w/2,0,h.w,GY);X.restore()}}
    else{const x0=cam-50,x1=cam+W+50;if(h.t>0){X.strokeStyle='#ff3d6e';X.globalAlpha=.35+.3*Math.sin(lvT*24);X.lineWidth=4;X.setLineDash([30,20]);X.beginPath();X.moveTo(x0,h.y);X.lineTo(x1,h.y);X.stroke();X.setLineDash([]);
        X.fillStyle='#ffd0dc';X.font=`700 34px ${FU}`;X.textAlign='center';X.fillText(h.low?'▲ JUMP':'▼ STAY LOW',cam+W/2,h.y-50);X.globalAlpha=1}
      else{X.save();X.globalCompositeOperation='lighter';X.globalAlpha=Math.min(1,h.act/.2);X.fillStyle='#ff3d6e';X.fillRect(x0,h.y-38,x1-x0,76);X.fillStyle='#fff';X.fillRect(x0,h.y-10,x1-x0,20);X.restore()}}}}
function drawPicks(){for(const k of picks){const c=k.type==='hp'?'#7dffb0':'#5ce1ff',y=k.y+Math.sin(lvT*4+k.x)*6;X.globalAlpha=k.life<2?(Math.floor(k.life*10)%2?.3:1):1;
    glowOn(c,20);X.fillStyle=c;X.beginPath();if(k.type==='hp'){X.arc(k.x,y,16,0,7)}else{X.moveTo(k.x,y-22);X.lineTo(k.x+14,y);X.lineTo(k.x,y+22);X.lineTo(k.x-14,y);X.closePath()}X.fill();glowOff();X.globalAlpha=1}}
function drawShots(){X.save();X.globalCompositeOperation='lighter';for(const s of shots){if(s.wave){X.globalAlpha=Math.min(1,s.life*2);X.strokeStyle=s.col;X.lineWidth=18;
      X.beginPath();X.arc(s.x-Math.sign(s.vx)*40,s.y,s.r+30,-1.1,1.1);X.stroke();X.lineWidth=6;X.strokeStyle='#fff';X.beginPath();X.arc(s.x-Math.sign(s.vx)*40,s.y,s.r+30,-.9,.9);X.stroke();
      if(s.vx<0){}continue}
    X.globalAlpha=1;X.fillStyle=s.col;X.beginPath();X.arc(s.x,s.y,s.r*1.6,0,7);X.globalAlpha=.3;X.fill();X.globalAlpha=1;X.fillStyle='#fff';X.beginPath();X.arc(s.x,s.y,s.r*.6,0,7);X.fill()}
  X.restore();X.globalAlpha=1}
function drawParts(){X.save();X.globalCompositeOperation='lighter';for(const q of parts){X.globalAlpha=Math.max(0,q.life/q.max);X.fillStyle=q.col;X.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz)}X.restore();X.globalAlpha=1}

  for(const e of en)if(!e.fly)e.type==='c'?drawCaster(e):drawHollow(e);

function hudBar(x,y,w,h,v,c1,c2){X.fillStyle='rgba(5,4,12,.7)';X.fillRect(x-3,y-3,w+6,h+6);const g=X.createLinearGradient(x,0,x+w,0);g.addColorStop(0,c1);g.addColorStop(1,c2);X.fillStyle=g;X.fillRect(x,y,w*Math.max(0,Math.min(1,v)),h);

  X.textAlign='right';X.font=`700 34px ${FU}`;X.fillStyle='#ece7ff';X.fillText(G.score.toLocaleString(),W-(touchy?150:48),66);X.font=`600 16px ${FU}`;X.fillStyle='#9d97bd';X.fillText('SCORE',W-(touchy?150:48),90);

  if(G.lv===0&&lvT<9&&!touchy){X.textAlign='center';X.font=`600 24px ${FU}`;X.fillStyle='rgba(236,231,255,.8)';X.fillText('A / D move   ·   W jump (twice to double jump)   ·   J strike   ·   K starburst   ·   Esc pause',W/2,H-50)}
  if(banner){const a=Math.min(1,banner.life*2,(banner.max-banner.life)*4);X.globalAlpha=a;X.textAlign='center';X.fillStyle='rgba(5,4,12,.45)';X.fillRect(0,H/2-130,W,banner.sub?190:150);
    X.font=`900 96px ${FD}`;X.fillStyle='#ece7ff';glowOn(L.glow,30);X.fillText(banner.t.toUpperCase(),W/2,H/2-30);glowOff();
    if(banner.sub){X.font=`600 34px ${FU}`;X.fillStyle=L.glow;X.fillText(banner.sub.toUpperCase(),W/2,H/2+30)}X.globalAlpha=1}

  if(p.hp<30){const v=X.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H);v.addColorStop(0,'rgba(255,0,60,0)');v.addColorStop(1,`rgba(255,0,60,${.25+Math.sin(lvT*5)*.1})`);X.fillStyle=v;X.fillRect(0,0,W,H)}
  if(G.state==='over'){X.fillStyle='rgba(5,4,12,.5)';X.fillRect(0,0,W,H)}}
function render(){if(!bg)return;X.save();const sx=shake?(Math.random()-.5)*shake*2:0,sy=shake?(Math.random()-.5)*shake*2:0;X.translate(sx,sy);
  drawBG();X.save();X.translate(-Math.round(cam),0);drawWorld();X.restore();X.restore();
  if(G.state!=='menu')drawHUD()}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;
  try{if(G.state==='play'&&!G.paused)update(dt);
    else if(G.state==='over'){updParts(dt);lvT+=dt;shake*=.9}
    else if(G.state==='menu'){lvT+=dt;cam+=dt*70;if(cam>bg.L.len-W)cam=0}
    render()}catch(err){console.error(err)}
  requestAnimationFrame(frame)}
toTitle();
